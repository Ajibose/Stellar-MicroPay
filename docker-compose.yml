# docker-compose.yml — Development (hot-reload)
#
# Usage:
#   docker compose up
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:4000
#
# For production:
#   docker compose -f docker-compose.prod.yml up

version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - STELLAR_NETWORK=testnet
      - HORIZON_URL=https://horizon-testnet.stellar.org
      - ALLOWED_ORIGINS=http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - ANALYTICS_CACHE_TTL_MS=300000
    depends_on:
      - redis
    volumes:
      # Mount source for hot-reload via nodemon
      - ./backend:/app
      # Preserve container's node_modules
      - /app/node_modules
    healthcheck:
      # Probe with node rather than wget: the image always ships node, and
      # 127.0.0.1 avoids busybox resolving "localhost" to ::1 first.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # The dev image installs dependencies on first boot, so allow a generous
      # grace period before healthcheck failures start counting toward retries.
      start_period: 180s
    restart: unless-stopped
    networks:
      - frontend
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_STELLAR_NETWORK=testnet
      - NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      # Enable polling so file-watch works on all host OSes (Linux/macOS/Windows)
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Mount source for hot-reload via Next.js HMR
      - ./frontend:/app
      # Preserve container's node_modules and Next.js build cache
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  backend:
    # Not `internal: true` — the API dials Horizon/Soroban RPC on startup and an
    # internal-only network leaves it with no default route, so it never binds
    # /health and the container stays unhealthy for the whole start_period.
    driver: bridge

volumes:
  redis_data:
