name: Lighthouse CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", "lighthouserc.json", ".github/workflows/lighthouse-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/**", "lighthouserc.json", ".github/workflows/lighthouse-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
      # treosh/lighthouse-ci-action@v12 no longer supports startServerCommand
      # (it warns "Unexpected input(s)" and never starts the server, so every
      # audit fails with CHROME_INTERSTITIAL_ERROR). Serve the static export
      # in a normal step instead and wait for it to accept connections.
      - name: Start static server
        run: |
          npm run start &
          npx --yes wait-on http://localhost:3000 --timeout 60000
      - name: Audit primary routes
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/dashboard
            http://localhost:3000/pay
          uploadArtifacts: true
          temporaryPublicStorage: false
