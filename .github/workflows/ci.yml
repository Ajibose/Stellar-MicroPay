name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, emmy/main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject whitespace errors and unresolved conflicts
        run: |
          git diff --check HEAD^
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)'

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

  backend:
    name: Backend (lint and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  contracts:
    name: Soroban contract (check, test, WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Install stellar-cli (required by soroban-sdk v28 build script)
        run: |
          if ! command -v stellar >/dev/null 2>&1; then
            curl -sSfL -o /tmp/stellar-cli.tar.gz https://github.com/stellar/stellar-cli/releases/download/v25.2.0/stellar-cli-25.2.0-x86_64-unknown-linux-gnu.tar.gz
            mkdir -p /tmp/stellar-cli && tar -xzf /tmp/stellar-cli.tar.gz -C /tmp/stellar-cli
            sudo install -m 755 /tmp/stellar-cli/stellar /usr/local/bin/stellar
          fi
          stellar --version
      # Run tests before the build: 'stellar contract build' writes a
      # .cargo/config.toml pinning build-target=wasm32v1-none at the workspace
      # root, which would otherwise force cargo test onto the wasm target and
      # fail with E0463 (can't find crate for `core`).
      - name: Run contract tests
        working-directory: contracts/stellar-micropay-contract
        run: cargo test
      - name: Build contract WASM
        working-directory: contracts/stellar-micropay-contract
        run: stellar contract build
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-micropay-contract-wasm
          # The contract is a workspace member, so cargo emits to the
          # workspace-root target/ rather than the crate directory.
          path: target/wasm32v1-none/release/stellar_micropay_contract.wasm
          if-no-files-found: error

  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn

  health-smoke:
    name: Docker Compose health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack with docker compose
        run: |
          if ! docker compose up -d --build --wait --wait-timeout 300; then
            echo "::group::Container logs"
            docker compose logs --no-color --tail=200
            echo "::endgroup::"
            exit 1
          fi
      - name: Wait for backend healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health >/dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose logs
          exit 1
      - name: Run /health smoke test
        run: SMOKE_HEALTH_ONLY=1 HEALTH_URL=http://localhost:4000 node scripts/smoke-test.js
      - name: Tear down stack
        if: always()
        run: docker compose down -v
